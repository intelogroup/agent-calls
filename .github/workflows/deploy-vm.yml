name: Deploy voice agent to Oracle VM

# One deploy at a time: a second dispatch cancels the earlier run.
# (The dispatch client can fire duplicates; concurrent setup.sh runs
# race on the VM's apt lock and kill each other.)
concurrency:
  group: deploy-vm
  cancel-in-progress: true

# Deploys server/ to the Oracle Cloud VM (129.159.189.244), provisions the
# LiveKit inbound voice stack, writes agent.env from secrets, creates the SIP
# trunk + dispatch rule, and (re)starts all services.
# The sandbox cannot SSH out, so this workflow is the deploy path.
#
# Required Actions secrets (repo Settings -> Secrets and variables -> Actions):
#   VM_SSH_KEY    private key matching the VM's authorized key
# Optional:
#   OPENROUTER_API_KEY  OpenRouter key (live agent brain: meta/muse-spark-1.3).
#   META_API_KEY        Meta direct key (fallback if no OpenRouter key).
#                 Without either key the worker idles gracefully.
#
# Triggers:
#   - Actions tab -> "Deploy voice agent to Oracle VM" -> Run workflow
#   - repository_dispatch event type "deploy-vm" (for automation)
#   - push to main touching server/** or this file.

on:
  workflow_dispatch:
  repository_dispatch:
    types: [deploy-vm]
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-vm.yml'
      - 'server/**'
      - 'JETT.md'

env:
  VM_HOST: 129.159.189.244
  VM_USER: ubuntu
  # Keepalive so a quiet long-running step (e.g. model downloads) can't hang
  # silently forever; ConnectTimeout fails fast instead of stalling.
  SSH_OPTS: -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=8

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        timeout-minutes: 2
        run: |
          [ -n "${{ secrets.VM_SSH_KEY }}" ] || { echo "missing secret VM_SSH_KEY"; exit 1; }
          if [ -z "${{ secrets.OPENROUTER_API_KEY }}" ]; then
            echo "NOTE: OPENROUTER_API_KEY not set — worker idles gracefully unless META_API_KEY is present."
          else
            echo "OPENROUTER_API_KEY present."
          fi
          if [ -n "${{ secrets.META_API_KEY }}" ]; then
            echo "META_API_KEY present (fallback)."
          fi
          echo "secrets OK"

      - name: Set up SSH
        timeout-minutes: 3
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/vm_key
          chmod 600 ~/.ssh/vm_key
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/vm_key $SSH_OPTS "$VM_USER@$VM_HOST" 'echo "ssh OK: $(hostname) $(date -u)"'

      - name: Copy server files to VM
        timeout-minutes: 5
        run: |
          tar czf - server JETT.md | ssh -i ~/.ssh/vm_key $SSH_OPTS "$VM_USER@$VM_HOST" \
            'sudo mkdir -p /opt/agent /tmp/stage && sudo tar xzf - -C /tmp/stage && sudo cp -r /tmp/stage/server/. /opt/agent/ && sudo cp /tmp/stage/JETT.md /opt/agent/JETT.md && sudo chown -R root:root /opt/agent && sudo rm -rf /tmp/stage'
          echo "files copied"

      - name: Provision VM (setup.sh)
        timeout-minutes: 40
        run: |
          echo "starting setup.sh on $VM_HOST at $(date -u)"
          ssh -i ~/.ssh/vm_key $SSH_OPTS "$VM_USER@$VM_HOST" \
            'stdbuf -oL -eL sudo bash /opt/agent/setup.sh'
          echo "setup.sh finished at $(date -u)"

      - name: Write agent.env from secrets
        timeout-minutes: 3
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          JETT_BRAIN_MODEL: ${{ secrets.JETT_BRAIN_MODEL }}
          META_API_KEY: ${{ secrets.META_API_KEY }}
        run: |
          python3 - <<'PYEOF' | ssh -i ~/.ssh/vm_key $SSH_OPTS "$VM_USER@$VM_HOST" \
            'sudo tee /opt/agent/agent.env > /dev/null && sudo chmod 600 /opt/agent/agent.env && sudo chown agent:agent /opt/agent/agent.env'
          import os
          vals = {
              "AGENT_NAME": "Jett",
              "AGENT_GREETING": "Hey, it's Jett's line. What do you want to talk about?",
              "LIVEKIT_URL": "ws://localhost:7880",
              # LIVEKIT_API_KEY / LIVEKIT_API_SECRET are generated server-side
              # by setup.sh into /opt/agent/livekit.env and merged at runtime.
              "OPENROUTER_API_KEY": os.environ.get("OPENROUTER_API_KEY", ""),
              "JETT_BRAIN_MODEL": os.environ.get(
                  "JETT_BRAIN_MODEL", "openrouter/free"),
              "META_API_KEY": os.environ.get("META_API_KEY", ""),
              "META_MODEL": "muse-spark-1.3",
              "BUS_REPO_SSH": "git@github.com:intelogroup/agent-call-bus.git",
              "BUS_DIR": "/opt/agent/bus",
              "CONSULT_TIMEOUT_SEC": "180",
              "AGENT_MAX_CALL_SEC": "600",
          }
          for k, v in vals.items():
              print(f"{k}={v}")
          PYEOF
          echo "agent.env written (OPENROUTER_API_KEY $([ -n "$OPENROUTER_API_KEY" ] && echo present || echo MISSING), META_API_KEY $([ -n "$META_API_KEY" ] && echo present || echo MISSING))"

      - name: Restart services and show status
        timeout-minutes: 5
        run: |
          ssh -i ~/.ssh/vm_key $SSH_OPTS "$VM_USER@$VM_HOST" \
            'sudo systemctl restart redis-server livekit-server livekit-sip jett-proxy.service'
          sleep 20
          ssh -i ~/.ssh/vm_key $SSH_OPTS "$VM_USER@$VM_HOST" \
            'for s in redis-server livekit-server livekit-sip jett-proxy; do printf "%-14s %s\n" "$s" "$(sudo systemctl is-active $s)"; done; echo "--- jett-proxy logs ---"; sudo journalctl -u jett-proxy.service --no-pager -n 30'

      - name: Create SIP trunk + dispatch rule
        timeout-minutes: 5
        run: |
          ssh -i ~/.ssh/vm_key $SSH_OPTS "$VM_USER@$VM_HOST" \
            'stdbuf -oL -eL sudo -u agent /opt/agent/venv/bin/python /opt/agent/setup-sip.py'
          # NB: runs AFTER the restart above — setup-sip.py needs livekit-server on :7880.
          echo "sip routing configured"

      - name: Verify brain wiring + OpenRouter reachability
        timeout-minutes: 5
        run: |
          ssh -i ~/.ssh/vm_key $SSH_OPTS "$VM_USER@$VM_HOST" \
            'sudo -u agent bash /opt/agent/verify-brain.sh'
