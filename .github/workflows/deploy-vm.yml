name: Deploy voice agent to Oracle VM

# Deploys server/ to the Oracle Cloud VM (129.159.189.244), provisions it,
# writes agent.env from secrets, and (re)starts the agent service.
# The sandbox cannot SSH out, so this workflow is the deploy path.
#
# Required Actions secrets (repo Settings -> Secrets and variables -> Actions):
#   VM_SSH_KEY    private key matching the VM's authorized key
#   SIP_USER      Linphone username the agent registers as
#   SIP_PASSWORD  Linphone password for that account
#
# Trigger: Actions tab -> "Deploy voice agent to Oracle VM" -> Run workflow,
# or push to main touching server/** or this file.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-vm.yml'
      - 'server/**'

env:
  VM_HOST: 129.159.189.244
  VM_USER: ubuntu
  # Keepalive so a quiet long-running step (e.g. model downloads) can't hang
  # silently forever; ConnectTimeout fails fast instead of stalling.
  SSH_OPTS: -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=8

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        timeout-minutes: 2
        run: |
          [ -n "${{ secrets.VM_SSH_KEY }}" ] || { echo "missing secret VM_SSH_KEY"; exit 1; }
          [ -n "${{ secrets.SIP_USER }}" ] || { echo "missing secret SIP_USER"; exit 1; }
          [ -n "${{ secrets.SIP_PASSWORD }}" ] || { echo "missing secret SIP_PASSWORD"; exit 1; }
          echo "secrets OK"

      - name: Set up SSH
        timeout-minutes: 3
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/vm_key
          chmod 600 ~/.ssh/vm_key
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/vm_key $SSH_OPTS "$VM_USER@$VM_HOST" 'echo "ssh OK: $(hostname) $(date -u)"'

      - name: Copy server files to VM
        timeout-minutes: 5
        run: |
          tar czf - server | ssh -i ~/.ssh/vm_key $SSH_OPTS "$VM_USER@$VM_HOST" \
            'sudo mkdir -p /opt/agent && sudo tar xzf - -C /opt/agent --strip-components=1 && sudo chown -R root:root /opt/agent'
          echo "files copied"

      - name: Provision VM (setup.sh)
        timeout-minutes: 40
        run: |
          echo "starting setup.sh on $VM_HOST at $(date -u)"
          ssh -i ~/.ssh/vm_key $SSH_OPTS "$VM_USER@$VM_HOST" \
            'stdbuf -oL -eL sudo bash /opt/agent/setup.sh'
          echo "setup.sh finished at $(date -u)"

      - name: Write agent.env from secrets
        timeout-minutes: 3
        env:
          SIP_USER: ${{ secrets.SIP_USER }}
          SIP_PASSWORD: ${{ secrets.SIP_PASSWORD }}
        run: |
          python3 - <<'PYEOF' | ssh -i ~/.ssh/vm_key $SSH_OPTS "$VM_USER@$VM_HOST" \
            'sudo tee /opt/agent/agent.env > /dev/null && sudo chmod 600 /opt/agent/agent.env && sudo chown agent:agent /opt/agent/agent.env'
          import os
          vals = {
              "AGENT_SIP_USER": os.environ["SIP_USER"],
              "AGENT_SIP_PASS": os.environ["SIP_PASSWORD"],
              "AGENT_SIP_DOMAIN": "sip.linphone.org",
              "AGENT_SIP_PORT": "5060",
              "AGENT_NAME": "Jett",
              "AGENT_RTP_PORT": "10000",
              "AGENT_PUBLIC_IP": "129.159.189.244",
              "AGENT_WHISPER_MODEL": "tiny.en",
              "AGENT_LLM_MODEL": "/opt/agent/models/llm.gguf",
              "AGENT_TTS_ENGINE": "espeak",
              "AGENT_THREADS": "1",
              "AGENT_MAX_TURNS": "8",
              "AGENT_MAX_CALL_SEC": "300",
              "AGENT_GREETING": "Hey, it's Jett. What do you want to talk about?",
          }
          for k, v in vals.items():
              print(f"{k}={v}")
          PYEOF
          echo "agent.env written"

      - name: Restart service and show status
        timeout-minutes: 5
        run: |
          ssh -i ~/.ssh/vm_key $SSH_OPTS "$VM_USER@$VM_HOST" \
            'sudo systemctl restart agent.service || sudo systemctl start agent.service'
          sleep 25
          ssh -i ~/.ssh/vm_key $SSH_OPTS "$VM_USER@$VM_HOST" \
            'sudo systemctl is-active agent.service; echo "--- recent logs ---"; sudo journalctl -u agent.service --no-pager -n 40'
