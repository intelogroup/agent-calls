name: dial

# Permanent parameterized outbound dial route for Jett's line.
# Replaces the one-shot push-dial-delete workflow pattern: dispatch
# this with to / name / brief / engine (+ dry_run to print the plan
# only, placing no call). This file STAYS on main.
#
# SECURITY: this workflow never prints secret values. Config files
# are parsed, never echoed; env presence is verified by NAME only;
# there is no env dump and no set -x anywhere in this file.

on:
  workflow_dispatch:
    inputs:
      to:
        description: "Callee number, E.164 (e.g. +16175550134)"
        required: true
        type: string
      name:
        description: "Callee name, exactly as given in the dispatch"
        required: true
        type: string
      brief:
        description: "What the agent should do on the call"
        required: true
        type: string
      engine:
        description: "Conversation engine"
        required: true
        type: choice
        options:
          - local
          - deepgram
        default: deepgram
      dry_run:
        description: "Print the dial plan only; place NO call"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  # Not secrets: the SIP outbound trunk id and Jett's caller number,
  # verified on the Oct 15 live outbound proof. Passed explicitly
  # because they do not exist in the runner's on-box config files.
  LIVEKIT_SIP_OUTBOUND_TRUNK_ID: "ST_NqGc4EfiT8mZ"
  JETT_PHONE_E164: "+16176556805"

jobs:
  dial:
    runs-on: [self-hosted, oracle]
    timeout-minutes: 60
    steps:
      - name: Checkout dialer (tmp/bridge-outbound @802cfa87)
        uses: actions/checkout@v4
        with:
          ref: 802cfa8775479ccfd09570121f803274e663ecc0

      - name: LiveKit SDK check (install into venv only if missing)
        run: |
          if /opt/agent/venv/bin/python -c "import livekit" 2>/dev/null; then
            echo "livekit SDK import OK (already installed in /opt/agent/venv)"
          else
            echo "livekit SDK missing; installing requirements.txt into /opt/agent/venv"
            /opt/agent/venv/bin/python -m pip install -r requirements.txt
            /opt/agent/venv/bin/python -c "import livekit"
            echo "livekit SDK import OK (installed this run)"
          fi

      - name: Assemble LiveKit env from on-box config (names only, values never printed)
        run: |
          cat > "$RUNNER_TEMP/assemble_env.py" <<'PYEOF'
          import glob, os, re, sys

          NAMES = ("LIVEKIT_URL", "LIVEKIT_API_KEY", "LIVEKIT_API_SECRET")
          found = {}
          sources = {}
          notes = []

          # Anything already in this process's environment wins.
          for name in NAMES:
              if os.environ.get(name):
                  found[name] = os.environ[name]
                  sources[name] = "process environment"

          def clean(v):
              v = (v or "").strip()
              if len(v) >= 2 and v[0] == v[-1] and v[0] in "\"'":
                  v = v[1:-1]
              return v.strip()

          def take(name, value, where):
              value = clean(value)
              if value and name not in found:
                  found[name] = value
                  sources[name] = where

          def scan_text(text, where):
              lines = text.splitlines()
              for line in lines:
                  for name in NAMES:
                      m = re.match(r"^\s*(?:export\s+|Environment\s*=\s*\"?)?" + name + r"\s*[:=]\s*(.+?)\s*$", line)
                      if m:
                          take(name, m.group(1).strip().strip('"'), where)
                  m = re.search(r"--keys\s+[\"']?([A-Za-z0-9_\-]+)\s*:\s*([^\s\"']+)", line)
                  if m:
                      take("LIVEKIT_API_KEY", m.group(1), where + " (--keys)")
                      take("LIVEKIT_API_SECRET", m.group(2), where + " (--keys)")
              for i, line in enumerate(lines):
                  if re.match(r"^\s*keys:\s*$", line):
                      for sub in lines[i + 1:]:
                          m = re.match(r"^\s+(\S+):\s*(\S+)\s*$", sub)
                          if m:
                              take("LIVEKIT_API_KEY", m.group(1), where + " (keys: map)")
                              take("LIVEKIT_API_SECRET", m.group(2), where + " (keys: map)")
                          elif sub.strip():
                              break
                      break

          def read(path):
              try:
                  if os.path.getsize(path) > 2_000_000:
                      return None
                  with open(path, errors="replace") as fh:
                      return fh.read()
              except OSError as e:
                  notes.append("unreadable: " + path + " (" + (e.strerror or "error") + ")")
                  return None

          candidates = []
          for pat in ("/opt/agent/**/*.env", "/opt/agent/**/*.yaml",
                      "/opt/agent/**/*.yml", "/opt/agent/.env",
                      "/opt/livekit/**/*.env", "/opt/livekit/**/*.yaml",
                      "/opt/livekit/**/*.yml", "/etc/livekit/**/*.env",
                      "/etc/livekit/**/*.yaml", "/etc/livekit/**/*.yml"):
              candidates += [p for p in glob.glob(pat, recursive=True)
                             if os.path.isfile(p)]

          extra = []
          for pat in ("/etc/systemd/system/*.service",
                      "/lib/systemd/system/*.service",
                      "/usr/lib/systemd/system/*.service"):
              for unit in glob.glob(pat):
                  if not re.search(r"(livekit|jett|agent)", os.path.basename(unit)):
                      continue
                  text = read(unit)
                  if text is None:
                      continue
                  scan_text(text, unit)
                  for m in re.finditer(r"EnvironmentFile\s*=\s*-?(\S+)", text):
                      extra.append(m.group(1))
                  for m in re.finditer(r"--config\s+(\S+)", text):
                      extra.append(m.group(1))

          for path in dict.fromkeys(candidates + extra):
              text = read(path)
              if text is not None:
                  scan_text(text, path)

          # Last resort for the URL: the LiveKit server runs on this
          # box, so derive ws://localhost:<port> from its server yaml.
          if "LIVEKIT_URL" not in found and "LIVEKIT_API_SECRET" in found:
              port = "7880"
              for path in dict.fromkeys(candidates + extra):
                  text = read(path) or ""
                  m = re.search(r"^\s*port:\s*(\d+)\s*$", text, re.M)
                  if m:
                      port = m.group(1)
                      break
              take("LIVEKIT_URL", "ws://localhost:" + port,
                   "derived from on-box LiveKit server port")

          env_file = os.environ.get("GITHUB_ENV")
          if env_file:
              with open(env_file, "a") as fh:
                  for name in NAMES:
                      if name in found and sources.get(name) != "process environment":
                          fh.write(name + "=" + found[name] + "\n")

          for name in NAMES + ("LIVEKIT_SIP_OUTBOUND_TRUNK_ID", "JETT_PHONE_E164"):
              present = bool(found.get(name) or os.environ.get(name))
              suffix = (" (from " + sources[name] + ")") if (present and name in sources) else ""
              print(name + ": " + ("SET" if present else "MISSING") + suffix)
          for n in notes:
              print("note: " + n)
          missing = [n for n in NAMES if n not in found]
          print("ASSEMBLY_RESULT: " + ("COMPLETE" if not missing
                                       else "INCOMPLETE " + ",".join(missing)))
          sys.exit(0 if not missing else 3)
          PYEOF
          set +e
          /opt/agent/venv/bin/python "$RUNNER_TEMP/assemble_env.py"
          rc=$?
          if [ $rc -eq 3 ]; then
            echo "Direct read incomplete; retrying assembly under sudo -n (values still never printed)"
            sudo -n /opt/agent/venv/bin/python "$RUNNER_TEMP/assemble_env.py"
            rc=$?
          fi
          if [ $rc -ne 0 ]; then
            echo "Required env missing; aborting before any dial."
          fi
          exit $rc

      - name: Dial
        env:
          TO: ${{ inputs.to }}
          NAME: ${{ inputs.name }}
          BRIEF: ${{ inputs.brief }}
          ENGINE: ${{ inputs.engine }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(--to "$TO" --name "$NAME" --brief "$BRIEF" --engine "$ENGINE")
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          /opt/agent/venv/bin/python dial.py "${args[@]}"
