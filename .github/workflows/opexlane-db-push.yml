name: opexlane-db-push
on:
  workflow_dispatch:
jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tmp-opexlane
    steps:
      - uses: actions/checkout@v4
      - name: Install Supabase CLI
        run: |
          curl -sSL --fail --retry 3 -o /tmp/supabase.tar.gz https://github.com/supabase/cli/releases/download/v2.117.0/supabase_linux_amd64.tar.gz
          tar xzf /tmp/supabase.tar.gz --no-same-owner -C /tmp
          /tmp/supabase --version
      - name: Push Opexlane migrations 0026-0034
        env:
          DBPW: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$DBPW" ]; then echo "SUPABASE_DB_PASSWORD secret is not set"; exit 1; fi
          DBURL=$(python3 -c "import urllib.parse,os; print('postgresql://postgres.fsbdpunmxdywfysobfrk:'+urllib.parse.quote(os.environ['DBPW'])+'@aws-0-ca-central-1.pooler.supabase.com:6543/postgres')")
          /tmp/supabase db push --db-url "$DBURL" --yes
