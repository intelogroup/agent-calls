# Probe SIP reachability for Jett's voice line.
#
# Runs every 30 minutes (plus manually). ANY probe failure makes the run
# fail loudly (nonzero exit) so a dead line is visible as a failed Actions
# run — the existing voice-call alert infra (service-uptime-call-watch and
# friends) can pick up failed runs and page Jim.
#
# Checks, from the public internet AND from inside the VM:
#   1. UDP 5060 answers a SIP OPTIONS (Linphone dials UDP by default —
#      this is the exact "no ring" bottleneck hit 2026-09-18)
#   2. TCP 5060 answers a SIP OPTIONS
#   3. livekit-sip is actually bound on UDP+TCP 5060 on the VM (ss)
#   4. livekit-sip + jett-proxy services are active
name: Probe SIP reachability
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

concurrency:
  group: sip-probe
  cancel-in-progress: true

env:
  VM_HOST: 129.159.189.244
  VM_USER: ubuntu
  SSH_OPTS: -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=8

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: SIP probes from the internet (UDP + TCP)
        run: |
          python3 - <<'EOF'
          import socket, sys

          failures = []

          def build_options(proto):
              return (
                  "OPTIONS sip:jett@129.159.189.244 SIP/2.0\r\n"
                  "Via: SIP/2.0/%s 1.2.3.4:5060;branch=z9hG4bKprobe1\r\n"
                  "From: <sip:probe@1.2.3.4>;tag=abc123\r\n"
                  "To: <sip:jett@129.159.189.244>\r\n"
                  "Call-ID: probe1@1.2.3.4\r\n"
                  "CSeq: 1 OPTIONS\r\n"
                  "Max-Forwards: 70\r\n"
                  "Content-Length: 0\r\n\r\n" % proto
              ).encode()

          # UDP probe (Linphone's default transport — the "no ring" path)
          try:
              s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
              s.settimeout(5)
              s.sendto(build_options("UDP"), ("129.159.189.244", 5060))
              data, _ = s.recvfrom(4096)
              first = data[:60].decode(errors="replace").split("\r\n")[0]
              print("UDP 5060: RESPONSE:", first)
              if not first.startswith("SIP/2.0"):
                  failures.append("UDP 5060 answered but not with SIP: " + first)
          except socket.timeout:
              msg = "UDP 5060: TIMEOUT — no SIP response (firewall or service down)"
              print(msg)
              failures.append(msg)
          except Exception as e:
              msg = "UDP 5060: ERROR: %s" % e
              print(msg)
              failures.append(msg)
          finally:
              s.close()

          # TCP probe
          try:
              s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
              s.settimeout(6)
              s.connect(("129.159.189.244", 5060))
              s.sendall(build_options("TCP"))
              data = s.recv(4096)
              first = data[:60].decode(errors="replace").split("\r\n")[0] if data else "<connected, empty>"
              print("TCP 5060: RESPONSE:", first)
              if data and not first.startswith("SIP/2.0"):
                  failures.append("TCP 5060 answered but not with SIP: " + first)
          except Exception as e:
              msg = "TCP 5060: ERROR: %s" % e
              print(msg)
              failures.append(msg)
          finally:
              s.close()

          if failures:
              print("INTERNET PROBE: FAIL")
              for f in failures:
                  print("  -", f)
              sys.exit(1)
          print("INTERNET PROBE: PASS")
          EOF

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/vm_key
          chmod 600 ~/.ssh/vm_key
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts

      - name: Check SIP listener + services on the VM (fails loudly)
        run: |
          ssh -i ~/.ssh/vm_key $SSH_OPTS "$VM_USER@$VM_HOST" \
            'fail=0
             sudo ss -uln | grep -q ":5060 " || { echo "FAIL: nothing bound on UDP 5060"; fail=1; }
             sudo ss -tln | grep -q ":5060 " || { echo "FAIL: nothing bound on TCP 5060"; fail=1; }
             [ "$(sudo systemctl is-active livekit-sip 2>/dev/null)" = "active" ] || { echo "FAIL: livekit-sip not active"; fail=1; }
             [ "$(sudo systemctl is-active jett-proxy 2>/dev/null)" = "active" ] || { echo "FAIL: jett-proxy not active"; fail=1; }
             if [ "$fail" = 0 ]; then echo "VM LISTENER CHECKS: PASS"; else echo "VM LISTENER CHECKS: FAIL"; fi
             exit $fail'
