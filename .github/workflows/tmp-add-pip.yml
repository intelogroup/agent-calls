name: "(temporary) install pip on oracle runner"
on:
  workflow_dispatch:
jobs:
  install:
    runs-on: [self-hosted, oracle]
    timeout-minutes: 10
    steps:
      - name: Install python3-pip and verify
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3-pip
          echo "--- verification ---"
          which pip3 || true
          python3 -m pip --version
          pip3 --version || true
          echo "PIP OK"
