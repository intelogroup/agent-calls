name: "(temporary) bench stt tts on fly machine"
on:
  workflow_dispatch:
jobs:
  bench:
    runs-on: [self-hosted, oracle]
    timeout-minutes: 15
    steps:
      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Run bench inside the worker machine via machine exec
        env:
          FLY_API_TOKEN: <redacted>
        run: |
          set -uo pipefail
          B64=""
          flyctl machine exec 83e133a7d9d178 "sh -c 'echo $B64 | base64 -d > /tmp/bench.py && python3 /tmp/bench.py'" -a jett-voice 2>&1 | tee bench-out.txt
          echo "exec exit: ${PIPESTATUS[0]}"
