name: "(temporary) deploy jett-bridge from oracle runner"
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: [self-hosted, oracle]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/bridge-receptionist
      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy jett-bridge (remote build, bridge-only config)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          flyctl version
          flyctl deploy --remote-only --config fly.bridge.toml
          flyctl status -a jett-bridge
          flyctl machine list -a jett-bridge
