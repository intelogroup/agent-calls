name: "(temporary) clixen deploy capability probe"

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: [self-hosted, oracle]
    timeout-minutes: 10
    steps:
      - name: Host and docker capability
        run: |
          echo "host: $(hostname) user: $(whoami)"
          echo "--- docker ---"
          docker --version 2>&1 || echo "NO_DOCKER"
          docker buildx version 2>&1 || echo "NO_BUILDX"
          echo "--- flyctl ---"
          which flyctl 2>&1 || echo "NO_FLYCTL_ON_PATH"
          echo "--- disk ---"
          df -h / /opt 2>/dev/null | tail -3
      - name: GitHub reachability for clixen-cloud (no credentials printed)
        run: |
          export GIT_TERMINAL_PROMPT=0
          echo "--- ssh ls-remote ---"
          timeout 30 git ls-remote git@github.com:intelogroup/clixen-cloud.git HEAD 2>&1 | head -3 || echo "SSH_LS_REMOTE_FAILED rc=$?"
          echo "--- https ls-remote ---"
          timeout 30 git ls-remote https://github.com/intelogroup/clixen-cloud.git HEAD 2>&1 | head -3 || echo "HTTPS_LS_REMOTE_FAILED rc=$?"
          echo "--- ssh keys present (names only) ---"
          ls -la ~/.ssh 2>/dev/null | awk '{print $9}' | grep -v '^\.$' | grep -v '^\.\.$' || echo "NO_SSH_DIR"
          echo "--- git credential helpers ---"
          git config --global --list 2>/dev/null | grep -i "credential\|url\." || echo "NONE"
