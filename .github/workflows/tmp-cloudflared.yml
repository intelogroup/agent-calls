name: tmp-diagnose-7880
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: [self-hosted, oracle]
    steps:
      - name: Full port identification
        run: |
          echo "--- all tcp listeners with process ---"
          sudo ss -tlnp | grep -v "^State" 
          echo "--- body of localhost:7880/ ---"
          curl -sS --max-time 10 http://localhost:7880/ | head -c 300; echo
          echo "--- what is python on 8081 ---"
          sudo ls -l /proc/58624/cwd 2>/dev/null; sudo tr '\0' ' ' < /proc/58624/cmdline 2>/dev/null; echo
          echo "--- livekit-server listening? ---"
          sudo ss -tlnp | grep -c 7880 || echo "no 7880 listener"
