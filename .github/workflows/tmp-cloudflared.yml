name: tmp-diagnose-7880
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: [self-hosted, oracle]
    steps:
      - name: Diagnose port 7880
        run: |
          echo "--- listening sockets ---"
          sudo ss -tlnp | grep -E "7880|LISTEN" | head -10
          echo "--- curl -i localhost:7880/ ---"
          curl -sS -i --max-time 10 http://localhost:7880/ | head -20
          echo "--- livekit service status ---"
          sudo systemctl is-active livekit-server.service livekit-sip.service jett-proxy.service 2>/dev/null
          echo "--- livekit config port ---"
          sudo grep -rE "port|address" /etc/livekit* /opt/agent/livekit* 2>/dev/null | grep -iv "password\|key\|secret" | head -10
