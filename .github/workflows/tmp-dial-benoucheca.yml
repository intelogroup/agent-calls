name: "(temporary) dial Benoucheca"
on:
  workflow_dispatch: {}
jobs:
  dial:
    runs-on: [self-hosted, oracle]
    timeout-minutes: 30
    steps:
      - name: Checkout voice stack (tmp/bridge-outbound @802cfa87)
        uses: actions/checkout@v4
        with:
          ref: 802cfa8775479ccfd09570121f803274e663ecc0

      - name: Install pinned SDK into the box venv
        run: |
          set -euo pipefail
          if [ -x /opt/agent/venv/bin/python ] && /opt/agent/venv/bin/python -m pip --version >/dev/null 2>&1; then
            PY=/opt/agent/venv/bin/python
            echo "using venv python: $PY"
            "$PY" -m pip install -r requirements.txt || sudo "$PY" -m pip install -r requirements.txt
          else
            PY=python3
            echo "venv pip unavailable; falling back to system python3 --break-system-packages"
            python3 -m pip install --break-system-packages -r requirements.txt
          fi
          echo "PY=$PY" >> "$GITHUB_ENV"
          "$PY" -c "import livekit; print('livekit SDK import OK')"

      - name: Place the call (env assembled on-box, values never printed)
        run: |
          set -euo pipefail
          load_env() {
            local f="$1" tmp
            [ -f "$f" ] || return 0
            tmp=$(mktemp)
            if [ -r "$f" ]; then cat "$f" > "$tmp"; else sudo cat "$f" > "$tmp" 2>/dev/null || { rm -f "$tmp"; return 0; }; fi
            set -a; . "$tmp"; set +a
            rm -f "$tmp"
          }
          load_env /opt/agent/livekit.env
          load_env /opt/agent/agent.env
          # Fill API key/secret from livekit.yaml keys: block if still unset.
          if [ -z "${LIVEKIT_API_KEY:-}" ] || [ -z "${LIVEKIT_API_SECRET:-}" ]; then
            LK_YAML=$(sudo find /opt /etc -maxdepth 4 -name livekit.yaml 2>/dev/null | head -1 || true)
            if [ -n "${LK_YAML:-}" ]; then
              eval "$(sudo awk '/^keys:/{f=1;next} f&&/^[^ ]/{exit} f{gsub(/[" ]/,""); split($0,a,":"); print "LIVEKIT_API_KEY=" a[1]; print "LIVEKIT_API_SECRET=" a[2]; exit}' "$LK_YAML")"
            fi
          fi
          # Fill trunk id / caller number from on-box config if still unset.
          grab() {
            local var="$1"
            sudo grep -rhoE "(^|[\"' ])${var}[[:space:]]*[:=][[:space:]]*[\"']?[^\"'[:space:]]+" /opt/agent /opt/livekit /etc/livekit 2>/dev/null | head -1 | sed -E "s/.*${var}[[:space:]]*[:=][[:space:]]*[\"']?//" || true
          }
          if [ -z "${LIVEKIT_SIP_OUTBOUND_TRUNK_ID:-}" ]; then
            LIVEKIT_SIP_OUTBOUND_TRUNK_ID="$(grab LIVEKIT_SIP_OUTBOUND_TRUNK_ID)"; export LIVEKIT_SIP_OUTBOUND_TRUNK_ID
          fi
          if [ -z "${JETT_PHONE_E164:-}" ]; then
            JETT_PHONE_E164="$(grab JETT_PHONE_E164)"; export JETT_PHONE_E164
          fi
          missing=""
          for v in LIVEKIT_URL LIVEKIT_API_KEY LIVEKIT_API_SECRET LIVEKIT_SIP_OUTBOUND_TRUNK_ID JETT_PHONE_E164; do
            [ -n "${!v:-}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then echo "MISSING ENV:$missing"; exit 1; fi
          echo "env OK: all 5 vars present (values not printed)"
          "$PY" dial.py --to +16178994780 --engine deepgram --name Benoucheca --brief "Warm personal message delivery from Jim. Greet Benoucheca by name, say you are Jett, Jim's assistant, calling on his behalf, and tell her: Jim asked me to call and tell you he's been thinking about you, he's missed you, and he wants to be with you tonight. Then chat briefly and warmly if she responds; do not invent plans, commitments, or any details Jim did not state, and do not discuss his schedule, money, or anything else."
