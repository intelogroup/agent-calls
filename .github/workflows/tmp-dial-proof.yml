name: "(temporary) outbound proof call to Jim's cell"
on:
  workflow_dispatch:
jobs:
  dial:
    runs-on: [self-hosted, oracle]
    timeout-minutes: 8
    steps:
      - name: Place outbound call via LiveKit Twirp API (stdlib only)
        run: |
          python3 - <<'PYEOF'
          import subprocess, json, time, hmac, hashlib, base64, urllib.request, urllib.error

          raw = subprocess.run(["sudo", "cat", "/opt/agent/livekit.yaml"],
                               capture_output=True, text=True).stdout
          api_key = api_secret = None
          port = 7880
          in_keys = False
          for ln in raw.splitlines():
              s = ln.strip()
              if s.startswith("port:") and not ln.startswith((" ", "\t")):
                  try:
                      port = int(s.split(":", 1)[1].strip())
                  except Exception:
                      pass
              if s == "keys:":
                  in_keys = True
                  continue
              if in_keys:
                  if ln.startswith((" ", "\t")) and ":" in s and not s.startswith("#"):
                      k, v = s.split(":", 1)
                      api_key, api_secret = k.strip(), v.strip().strip('"').strip("'")
                      in_keys = False
                  elif s:
                      in_keys = False
              if api_key is None and s.startswith("api_key:"):
                  api_key = s.split(":", 1)[1].strip().strip('"').strip("'")
              if api_secret is None and s.startswith("api_secret:"):
                  api_secret = s.split(":", 1)[1].strip().strip('"').strip("'")
          assert api_key and api_secret, "livekit keys not found"
          print("lk key:", api_key, "| port:", port)

          ROOM = "jett-out-proof-" + str(int(time.time()))
          TO = "+18574261739"
          BRIEF = ("Outbound proof call on Jim's new Telnyx line. Greet Jim warmly, "
                   "confirm he can hear you clearly, and ask him to confirm the caller "
                   "ID on his phone showed 617-655-6805. Keep it short and friendly, "
                   "then wrap up and say goodbye.")

          def b64(b):
              return base64.urlsafe_b64encode(b).rstrip(b"=").decode()

          now = int(time.time())
          header = {"alg": "HS256", "typ": "JWT"}
          claims = {"iss": api_key, "sub": "jett-dial-proof", "nbf": now - 10,
                    "exp": now + 3600, "sip": {"admin": True, "call": True},
                    "video": {"roomCreate": True, "roomAdmin": True, "room": ROOM,
                              "canPublish": False, "canSubscribe": False}}
          msg = b64(json.dumps(header).encode()) + "." + b64(json.dumps(claims).encode())
          jwt = msg + "." + b64(hmac.new(api_secret.encode(), msg.encode(), hashlib.sha256).digest())

          def twirp(service, method, body, timeout=180):
              url = "http://127.0.0.1:%d/twirp/%s/%s" % (port, service, method)
              req = urllib.request.Request(url, data=json.dumps(body).encode(), method="POST")
              req.add_header("Content-Type", "application/json")
              req.add_header("Authorization", "Bearer " + jwt)
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      return json.loads(r.read())
              except urllib.error.HTTPError as e:
                  raise SystemExit("%s/%s -> HTTP %s: %s" % (service, method, e.code, e.read().decode()[:400]))

          r = twirp("livekit.RoomService", "CreateRoom", {"name": ROOM})
          print("room created:", r.get("name") or ROOM)
          d = twirp("livekit.AgentDispatchService", "CreateAgentDispatch",
                    {"room": ROOM, "agentName": "jett-proxy",
                     "metadata": json.dumps({"direction": "outbound", "to": TO, "brief": BRIEF})})
          print("dispatch created:", d.get("id") or d.get("dispatch_id") or "ok")
          print("dialing", TO, "- waiting for answer...")
          p = twirp("livekit.SIP", "CreateSIPParticipant",
                    {"sipTrunkId": "ST_NqGc4EfiT8mZ", "sipCallTo": TO,
                     "sipNumber": "+16176556805", "roomName": ROOM,
                     "participantIdentity": "callee-" + TO,
                     "waitUntilAnswered": True, "krispEnabled": True})
          print("ANSWERED. sip_call_id:", p.get("sip_call_id") or p.get("sipCallId") or "created")
          print("DIAL OK")
          PYEOF
