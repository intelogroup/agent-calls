name: "(temporary) deploy jett-voice from oracle runner"
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: [self-hosted, oracle]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/fly-build
      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Set Deepgram secret on the app (bridge A/B)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_DEPLOY_TOKEN }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
        run: |
          if [ -n "$DEEPGRAM_API_KEY" ]; then
            flyctl secrets set DEEPGRAM_API_KEY="$DEEPGRAM_API_KEY" -a jett-voice --stage
            echo "DEEPGRAM_API_KEY staged on jett-voice"
          else
            echo "DEEPGRAM_API_KEY repo secret not set; skipping (bridge stays off)"
          fi
      - name: Deploy jett-voice (remote build)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          flyctl version
          flyctl deploy --remote-only --config fly.toml
          flyctl status -a jett-voice
