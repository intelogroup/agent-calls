name: "(temporary) deploy jett-voice from oracle runner"
on:
  workflow_dispatch:
    inputs:
      fly_token:
        description: "Fly API token (transient)"
        required: true
jobs:
  deploy:
    runs-on: [self-hosted, oracle]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/fly-build
      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy jett-voice (remote build)
        env:
          FLY_API_TOKEN: ${{ inputs.fly_token }}
        run: |
          set -euo pipefail
          flyctl version
          flyctl deploy --remote-only --config fly.toml
          flyctl status -a jett-voice
