name: tmp-fly-logs
on:
  workflow_dispatch: {}
jobs:
  logs:
    runs-on: [self-hosted, oracle]
    timeout-minutes: 6
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Recent jett-voice worker logs
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_DEPLOY_TOKEN }}
        run: |
          timeout 45 flyctl logs -a jett-voice --no-tail 2>&1 | tail -400 > flylogs.txt || true
          echo "=== session/brain/stt/tts lines ==="
          grep -aiE 'session started|call brain|brain usage|brain_attempt|brain_exhausted|stt_|tts_|caller hung|room |registered worker|speaking|listening|consult_' flylogs.txt | tail -60 || true
