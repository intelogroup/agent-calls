name: tmp-fwd-test-dial

# Temporary one-shot workflow (pattern authorized by Jim): places ONE
# outbound test call to Jim's own cell so T-Mobile conditional
# forwarding hands the call to the Jett line, exercising the
# forwarded-call path end to end. This file is deleted from main
# immediately after the run. No step in this file prints environment
# values; credentials are loaded silently from the server config and
# registered as masks before any use.

on:
  workflow_dispatch:

jobs:
  dial:
    runs-on: [self-hosted, oracle]
    steps:
      - name: Check out the bridge-outbound tree (dial.py lives at its root)
        uses: actions/checkout@v4
        with:
          ref: tmp/bridge-outbound
          path: tree

      - name: Install LiveKit Python SDK into a fresh libs dir
        run: |
          rm -rf "$GITHUB_WORKSPACE/fwd-libs"
          python3 -m pip install --target "$GITHUB_WORKSPACE/fwd-libs" livekit==1.1.20 livekit-api==1.2.1

      - name: Load LiveKit dialer env from the server config (values never printed)
        run: |
          python3 - <<'PYEOF'
          import os, subprocess
          raw = subprocess.run(["sudo", "cat", "/opt/agent/livekit.yaml"],
                               capture_output=True, text=True).stdout
          key = secret = None
          in_keys = False
          for ln in raw.splitlines():
              s = ln.strip()
              if s == "keys:":
                  in_keys = True
                  continue
              if in_keys:
                  if ln.startswith((" ", "\t")) and ":" in s and not s.startswith("#"):
                      k, v = s.split(":", 1)
                      key, secret = k.strip(), v.strip()
                      break
                  elif s:
                      in_keys = False
          assert key and secret, "livekit keys not found"
          print(f"::add-mask::{secret}")
          print(f"::add-mask::{key}")
          env = {
              "LIVEKIT_URL": "http://localhost:7880",
              "LIVEKIT_API_KEY": key,
              "LIVEKIT_API_SECRET": secret,
              "LIVEKIT_SIP_OUTBOUND_TRUNK_ID": "ST_NqGc4EfiT8mZ",
              "JETT_PHONE_E164": "+16176556805",
          }
          with open(os.environ["GITHUB_ENV"], "a") as fh:
              for k, v in env.items():
                  fh.write(f"{k}={v}\n")
          print("dialer env loaded (values not shown)")
          PYEOF

      - name: Warning window - Jim lets his cell ring untouched
        run: sleep 120

      - name: Dry-run plan first (no call placed)
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/fwd-libs" python3 tree/dial.py \
            --to +18574261739 --engine local \
            --brief "This is an automated test of Jim's call forwarding. When someone answers, say exactly that this is a test message for the forwarding check, leave the test message 'Forwarding test one, no-answer case' and ask the answerer to please take the message for Jim, then end politely after a short exchange." \
            --dry-run

      - name: Place the ONE test call
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/fwd-libs" python3 tree/dial.py \
            --to +18574261739 --engine local \
            --brief "This is an automated test of Jim's call forwarding. When someone answers, say exactly that this is a test message for the forwarding check, leave the test message 'Forwarding test one, no-answer case' and ask the answerer to please take the message for Jim, then end politely after a short exchange." \
            | tee dial-output.txt

      - name: Let the call play out
        run: sleep 120

      - name: Upload dial output
        uses: actions/upload-artifact@v4
        with:
          name: fwd-test-dial-output
          path: dial-output.txt
          if-no-files-found: ignore
