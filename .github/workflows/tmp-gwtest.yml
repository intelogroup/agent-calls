name: tmp-gateway-test
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: [self-hosted, oracle]
    steps:
      - name: Probe AI Gateway (no auth first)
        run: |
          echo "--- workers-ai via gateway, no CF token ---"
          curl -sS --max-time 60 -w "\nhttp=%{http_code}\n" -X POST \
            "https://gateway.ai.cloudflare.com/v1/c33b1793391df60672de585ebdee3791/opencode-jim/workers-ai/@cf/zai-org/glm-4.7-flash" \
            -H "Content-Type: application/json" \
            -d '{"messages":[{"role":"user","content":"Reply with exactly: GATEWAY-GLM-OK"}]}' | head -c 600
          echo
          echo "--- openai-compat endpoint shape ---"
          curl -sS --max-time 30 -o /dev/null -w "http=%{http_code}\n" -X POST \
            "https://gateway.ai.cloudflare.com/v1/c33b1793391df60672de585ebdee3791/opencode-jim/compat/chat/completions" \
            -H "Content-Type: application/json" \
            -d '{"model":"@cf/zai-org/glm-4.7-flash","messages":[{"role":"user","content":"hi"}]}'
