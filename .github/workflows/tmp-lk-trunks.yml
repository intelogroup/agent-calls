name: "(temporary) apply Telnyx LiveKit trunks"
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: [self-hosted, oracle]
    timeout-minutes: 10
    outputs:
      outbound_trunk_id: ${{ steps.apply.outputs.outbound_trunk_id }}
      inbound_trunk_id: ${{ steps.apply.outputs.inbound_trunk_id }}
    steps:
      - name: Apply SIP trunks via LiveKit Twirp API
        id: apply
        env:
          TELNYX_PW: ${{ secrets.TELNYX_CONN_PASSWORD }}
        run: |
          python3 - <<'PYEOF'
          import subprocess, json, os, time, hmac, hashlib, base64, urllib.request, urllib.error

          raw = subprocess.run(["sudo", "cat", "/opt/agent/livekit.yaml"],
                               capture_output=True, text=True).stdout
          api_key = api_secret = None
          port = 7880
          in_keys = False
          for ln in raw.splitlines():
              s = ln.strip()
              if s.startswith("port:") and not ln.startswith((" ", "\t")):
                  try:
                      port = int(s.split(":", 1)[1].strip())
                  except Exception:
                      pass
              if s == "keys:":
                  in_keys = True
                  continue
              if in_keys:
                  if ln.startswith((" ", "\t")) and ":" in s and not s.startswith("#"):
                      k, v = s.split(":", 1)
                      api_key, api_secret = k.strip(), v.strip().strip('"').strip("'")
                      in_keys = False
                  elif s:
                      in_keys = False
              if api_key is None and s.startswith("api_key:"):
                  api_key = s.split(":", 1)[1].strip().strip('"').strip("'")
              if api_secret is None and s.startswith("api_secret:"):
                  api_secret = s.split(":", 1)[1].strip().strip('"').strip("'")
          assert api_key and api_secret, "livekit keys not found in /opt/agent/livekit.yaml"
          print("lk api key name:", api_key, "| port:", port)

          def b64(b):
              return base64.urlsafe_b64encode(b).rstrip(b"=").decode()

          now = int(time.time())
          header = {"alg": "HS256", "typ": "JWT"}
          claims = {"iss": api_key, "sub": "jett-trunk-apply", "nbf": now - 10,
                    "exp": now + 3600, "sip": {"admin": True, "call": True},
                    "video": {"roomAdmin": True, "room": "*", "canPublish": False,
                              "canSubscribe": False}}
          msg = b64(json.dumps(header).encode()) + "." + b64(json.dumps(claims).encode())
          jwt = msg + "." + b64(hmac.new(api_secret.encode(), msg.encode(), hashlib.sha256).digest())

          BASE = "http://127.0.0.1:%d/twirp/livekit.SIP/" % port

          def twirp(method, body):
              req = urllib.request.Request(BASE + method, data=json.dumps(body).encode(), method="POST")
              req.add_header("Content-Type", "application/json")
              req.add_header("Authorization", "Bearer " + jwt)
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return json.loads(r.read())
              except urllib.error.HTTPError as e:
                  raise SystemExit("%s -> HTTP %s: %s" % (method, e.code, e.read().decode()[:400]))

          pw = os.environ["TELNYX_PW"]
          assert pw, "TELNYX_CONN_PASSWORD secret is empty"

          items = twirp("ListSIPInboundTrunk", {}).get("items", [])
          inb = next((t for t in items if t.get("name") == "telnyx-in"), None)
          if not inb:
              inb = twirp("CreateSIPInboundTrunk", {"trunk": {
                  "name": "telnyx-in", "numbers": ["+16176556805"],
                  "allowedAddresses": ["sip.telnyx.com"]}})
          in_id = inb["sipTrunkId"]
          print("inbound trunk:", in_id)

          items = twirp("ListSIPOutboundTrunk", {}).get("items", [])
          outb = next((t for t in items if t.get("name") == "telnyx-out"), None)
          if not outb:
              outb = twirp("CreateSIPOutboundTrunk", {"trunk": {
                  "name": "telnyx-out", "address": "sip.telnyx.com", "transport": 2,
                  "numbers": ["+16176556805"], "authUsername": "jettlivekit",
                  "authPassword": pw,
                  "headersToAttributes": {"X-Telnyx-Username": "jettlivekit"}}})
          out_id = outb["sipTrunkId"]
          print("outbound trunk:", out_id)

          rules = twirp("ListSIPDispatchRule", {}).get("items", [])
          rule = next((t for t in rules if t.get("name") == "telnyx-inbound-to-jett-proxy"), None)
          if not rule:
              rule = twirp("CreateSIPDispatchRule", {"dispatchRule": {
                  "name": "telnyx-inbound-to-jett-proxy", "trunkIds": [in_id],
                  "rule": {"dispatchRuleIndividual": {"roomPrefix": "jett-"}},
                  "roomConfig": {"agents": [{"agentName": "jett-proxy"}]}}})
          print("dispatch rule:", rule["sipDispatchRuleId"])

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("inbound_trunk_id=%s\noutbound_trunk_id=%s\n" % (in_id, out_id))
          print("APPLY OK")
          PYEOF
  flyenv:
    needs: apply
    runs-on: [self-hosted, oracle]
    timeout-minutes: 15
    steps:
      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Set worker env secrets on jett-voice
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          flyctl secrets set -a jett-voice \
            "JETT_PHONE_E164=+16176556805" \
            "PSTN_TRANSFER_URI=sip:+18574261739@sip.telnyx.com" \
            "LIVEKIT_SIP_OUTBOUND_TRUNK_ID=${{ needs.apply.outputs.outbound_trunk_id }}"
          flyctl secrets list -a jett-voice | grep -E "JETT_PHONE|PSTN_TRANSFER|LIVEKIT_SIP" || true
          flyctl status -a jett-voice
