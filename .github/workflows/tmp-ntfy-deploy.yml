name: tmp-ntfy-deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, oracle]
    timeout-minutes: 20
    steps:
      - name: Install ntfy binary
        run: |
          set -e
          if ! command -v ntfy >/dev/null; then
            TAG=$(curl -s -m 20 https://api.github.com/repos/binwiederhier/ntfy/releases/latest | grep -m1 '"tag_name"' | cut -d'"' -f4)
            echo "installing ntfy $TAG"
            curl -sL -m 120 -o /tmp/ntfy.tgz "https://github.com/binwiederhier/ntfy/releases/download/${TAG}/ntfy_${TAG#v}_linux_amd64.tar.gz"
            tar -tzf /tmp/ntfy.tgz
            tar -xzf /tmp/ntfy.tgz -C /tmp
            BIN=$(find /tmp -maxdepth 3 -name ntfy -type f | head -1)
            echo "binary at $BIN"
            sudo install -m 0755 "$BIN" /usr/local/bin/ntfy
            rm -f /tmp/ntfy.tgz /tmp/ntfy
          fi
          ntfy --version

      - name: Configure ntfy server
        run: |
          set -e
          sudo mkdir -p /etc/ntfy /var/lib/ntfy /var/cache/ntfy
          sudo tee /etc/ntfy/server.yml >/dev/null <<'EOF'
          listen-http: "127.0.0.1:2580"
          base-url: "https://ntfy-alerts.clixen.app"
          behind-proxy: true
          upstream-base-url: "https://ntfy.sh"
          cache-file: "/var/lib/ntfy/cache.db"
          auth-file: "/etc/ntfy/auth.db"
          auth-default-access: "deny-all"
          EOF
          sudo chmod 600 /etc/ntfy/server.yml
          if ! id ntfy >/dev/null 2>&1; then
            sudo useradd --system --no-create-home --shell /usr/sbin/nologin ntfy
          fi
          sudo chown -R ntfy:ntfy /var/lib/ntfy /var/cache/ntfy

      - name: Create ntfy user, topic grant, tunnel token file
        run: |
          set -e
          # Password generated on-VM, stored root-only, never printed.
          PW_FILE=/etc/ntfy/.pw
          if [ ! -f "$PW_FILE" ]; then
            openssl rand -hex 24 | sudo tee "$PW_FILE" >/dev/null
            sudo chmod 600 "$PW_FILE"
          fi
          PW=$(sudo cat "$PW_FILE")
          TOPIC_FILE=/etc/ntfy/.topic
          if [ ! -f "$TOPIC_FILE" ]; then
            printf 'money-emergencies-%s' "$(openssl rand -hex 4)" | sudo tee "$TOPIC_FILE" >/dev/null
            sudo chmod 600 "$TOPIC_FILE"
          fi
          TOPIC=$(sudo cat "$TOPIC_FILE")
          NTFY_USER=alerts
          if ! sudo ntfy -c /etc/ntfy/server.yml user list 2>/dev/null | grep -q "^${NTFY_USER}$"; then
            printf '%s\n%s\n' "$PW" "$PW" | sudo ntfy -c /etc/ntfy/server.yml user add "$NTFY_USER" >/dev/null
          fi
          sudo ntfy -c /etc/ntfy/server.yml access "$NTFY_USER" "$TOPIC" read-write
          echo "topic=$TOPIC" | sudo tee /etc/ntfy/.topic_public >/dev/null
          sudo chmod 644 /etc/ntfy/.topic_public
          # Tunnel token from Actions secret (masked in logs), stored root-only.
          printf '%s' '${{ secrets.NTFY_TUNNEL_TOKEN }}' | sudo tee /etc/cloudflared/ntfy-token >/dev/null
          sudo chmod 600 /etc/cloudflared/ntfy-token
          echo "ntfy user + access configured; token file written"

      - name: Install systemd units and start
        run: |
          set -e
          sudo tee /etc/systemd/system/ntfy.service >/dev/null <<'EOF'
          [Unit]
          Description=ntfy push notification server
          After=network.target
          [Service]
          Type=simple
          User=ntfy
          ExecStart=/usr/local/bin/ntfy serve -c /etc/ntfy/server.yml
          Restart=always
          RestartSec=5
          NoNewPrivileges=true
          [Install]
          WantedBy=multi-user.target
          EOF
          sudo tee /etc/systemd/system/cloudflared-ntfy.service >/dev/null <<'EOF'
          [Unit]
          Description=cloudflared tunnel for ntfy alerts
          After=network.target
          [Service]
          Type=simple
          ExecStart=/usr/local/bin/cloudflared tunnel --no-autoupdate run --token-file /etc/cloudflared/ntfy-token
          Restart=always
          RestartSec=5
          NoNewPrivileges=true
          [Install]
          WantedBy=multi-user.target
          EOF
          sudo systemctl daemon-reload
          sudo systemctl enable --now ntfy.service
          sudo systemctl enable --now cloudflared-ntfy.service
          sleep 4
          sudo systemctl is-active ntfy.service
          sudo systemctl is-active cloudflared-ntfy.service
          echo "--- existing livekit tunnel untouched ---"
          pgrep -a cloudflared

      - name: Verify auth behavior locally
        run: |
          set -e
          PW=$(sudo cat /etc/ntfy/.pw)
          TOPIC=$(sudo cat /etc/ntfy/.topic)
          echo "health: $(curl -s -o /dev/null -w '%{http_code}' -m 10 http://127.0.0.1:2580/v1/health)"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -m 10 -u "alerts:${PW}" -d 'ntfy self-host test' "http://127.0.0.1:2580/${TOPIC}")
          echo "authed publish: $CODE"; [ "$CODE" = "200" ]
          BODY=$(curl -s -m 10 -u "alerts:${PW}" "http://127.0.0.1:2580/${TOPIC}/json?poll=1")
          echo "$BODY" | grep -q 'ntfy self-host test' && echo "authed fetch: message retrieved"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -m 10 -d 'intruder' "http://127.0.0.1:2580/${TOPIC}")
          echo "unauthed publish: $CODE"; [ "$CODE" = "401" ] || [ "$CODE" = "403" ]
          echo "ALL LOCAL CHECKS PASS"

      - name: Verify public reach via tunnel
        run: |
          set -e
          for i in $(seq 1 24); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -m 15 https://ntfy-alerts.clixen.app/v1/health || true)
            echo "attempt $i: $CODE"
            if [ "$CODE" = "200" ]; then echo "PUBLIC REACH OK"; exit 0; fi
            sleep 10
          done
          echo "PUBLIC REACH FAILED"; exit 1
