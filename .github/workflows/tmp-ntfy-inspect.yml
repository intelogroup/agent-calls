name: tmp-ntfy-inspect

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: [self-hosted, oracle]
    timeout-minutes: 10
    steps:
      - name: Inspect VM for ntfy deployment
        run: |
          echo "=== OS ==="; cat /etc/os-release | head -3; uname -m
          echo "=== docker ==="; (docker --version || echo NO_DOCKER); (systemctl is-active docker || echo docker_inactive)
          echo "=== listening ports ==="; ss -tlnp 2>/dev/null | head -40
          echo "=== cloudflared ==="; (pgrep -a cloudflared || echo NO_CLOUDFLARED); (which cloudflared || echo no_cloudflared_bin)
          echo "=== ntfy already? ==="; (pgrep -a ntfy || echo NO_NTFY); (which ntfy || echo no_ntfy_bin)
          echo "=== livekit ==="; (pgrep -a livekit | head -3 || echo NO_LIVEKIT)
          echo "=== disk/mem ==="; df -h / | tail -1; free -m | head -2
          echo "=== curl to ntfy.sh (upstream reachability) ==="; curl -s -o /dev/null -w "%{http_code}\n" -m 10 https://ntfy.sh || echo CURL_FAIL
