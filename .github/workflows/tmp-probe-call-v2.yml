name: tmp-probe-call-v2
# TEMPORARY probe workflow. Authorized by Jim on 2026-10-15 for ONE run
# against the fixed jett-voice worker (v33, Phonon turn-finalization
# fix), then deleted from main.
#
# Everything here is plain, readable text. The probe client and its
# caller audio are ordinary files on the tmp/probe-harness branch
# (probe/probe_client.py, probe/caller16.wav) - no encoded payloads.
# The probe creates a LiveKit room with embedded agent dispatch
# (outbound-marked metadata pointing at a non-dialable placeholder, so
# the Deepgram bridge is skipped and the local Phonon-2 + Pocket
# pipeline serves), joins as a WebRTC tester, speaks a known line, and
# records whether the agent answers while the call is still live.
# No PSTN, no SIP participant, no real phone number is dialed.
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: [self-hosted, oracle]
    timeout-minutes: 15
    steps:
      - name: Check out probe harness branch (client + audio as plain files)
        uses: actions/checkout@v4
        with:
          ref: tmp/probe-harness
          path: harness
      - name: Show what will run
        run: |
          date -u
          ls -la harness/probe/
          head -20 harness/probe/probe_client.py
      - name: Install LiveKit Python SDK into /tmp/probe-libs
        run: |
          python3 -m pip install --target=/tmp/probe-libs "livekit>=0.20,<2"
          ls /tmp/probe-libs | head -5
      - name: Run probe client against the production worker
        run: |
          mkdir -p probe-out
          cd probe-out
          set +e
          python3 ../harness/probe/probe_client.py ../harness/probe/caller16.wav 2>&1 | tee probe.log
          echo "client_exit=${PIPESTATUS[0]}" | tee -a probe.log
          ls -la
      - name: Worker logs around the probe (registration + session receipts)
        if: always()
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_DEPLOY_TOKEN }}
        run: |
          set +e
          curl -sL https://github.com/superfly/flyctl/releases/download/v0.3.207/flyctl_0.3.207_Linux_x86_64.tar.gz -o /tmp/flyctl.tgz
          tar -xzf /tmp/flyctl.tgz -C /tmp
          /tmp/flyctl logs -a jett-voice --no-tail > /tmp/fly-logs-full.txt 2>&1
          grep -aiE "AW_|registered|jett-probe|call_start|call_classified|call_ended|transcript|phonon|pocket|transcription_rescue|error" /tmp/fly-logs-full.txt | tail -250 > probe-out/fly-logs.txt
          wc -l probe-out/fly-logs.txt
          true
      - name: Upload probe artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-v2-results
          path: probe-out/
          if-no-files-found: warn
