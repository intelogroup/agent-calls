name: tmp-probe-logs
on:
  workflow_dispatch:
jobs:
  logs:
    runs-on: [self-hosted, oracle]
    timeout-minutes: 8
    steps:
      - name: Fly worker logs around the probes
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_DEPLOY_TOKEN }}
        run: |
          curl -sL https://github.com/superfly/flyctl/releases/download/v0.3.207/flyctl_0.3.207_Linux_x86_64.tar.gz -o /tmp/flyctl.tgz
          tar -xzf /tmp/flyctl.tgz -C /tmp
          /tmp/flyctl logs -a jett-voice --no-tail 2>&1 | grep -aiE "probe|tester|call_start|call_end|call_classified|session|transcript|registered|starting agent|error|phonon|turn|vad|interim|eou|metrics" | tail -120 || true
