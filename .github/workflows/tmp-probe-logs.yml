name: tmp-probe-logs
on:
  workflow_dispatch:
jobs:
  logs:
    runs-on: [self-hosted, oracle]
    timeout-minutes: 4
    steps:
      - name: Pull fly logs, grep probe window
        uses: superfly/flyctl-actions/setup-flyctl@master
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_DEPLOY_TOKEN }}
        run: |
          timeout 90 flyctl logs -a jett-voice --no-tail > flylogs.txt 2>&1 || true
          wc -l flylogs.txt
          echo "=== lines mentioning the probe call ==="
          grep -a "1792103503" flylogs.txt | head -60 || true
          echo "=== all event lines 22:31-22:33Z ==="
          grep -aE "2026-10-15T22:3[123]" flylogs.txt | grep -aE '"event"|ERROR|WARN|transcri|phonon|vad|turn|endpoint' | head -60 || true
