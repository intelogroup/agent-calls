name: tmp-sip-journal
on:
  workflow_dispatch: {}
jobs:
  j:
    runs-on: [self-hosted, oracle]
    steps:
      - name: SIP and LiveKit journals since 18:38 UTC
        run: |
          echo '===== livekit-sip ====='
          journalctl -u livekit-sip --since '2026-10-13 18:38:00' --no-pager 2>/dev/null | tail -60
          echo '===== livekit-server (jett rooms) ====='
          journalctl -u livekit-server --since '2026-10-13 18:38:00' --no-pager 2>/dev/null | grep -aiE 'jett|sip|participant|room' | tail -40
