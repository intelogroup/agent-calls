name: tmp-sip-journal
on:
  workflow_dispatch: {}
jobs:
  j:
    runs-on: [self-hosted, oracle]
    steps:
      - name: Journals and log config for the 18:47-18:53 window
        run: |
          systemctl cat livekit-server livekit-sip 2>/dev/null | grep -iE 'ExecStart|StandardOutput|StandardError' || true
          ls -la /var/log/ | grep -iE 'livekit|sip' || echo 'no livekit log files in /var/log'
          echo '===== livekit-sip 18:47-18:53 (unfiltered tail) ====='
          journalctl -u livekit-sip --since '2026-10-13 18:47:00' --until '2026-10-13 18:53:30' --no-pager 2>/dev/null | tail -30
          echo '===== livekit-server 18:47-18:53 room/participant lines ====='
          journalctl -u livekit-server --since '2026-10-13 18:47:00' --until '2026-10-13 18:53:30' --no-pager 2>/dev/null | grep -aiE 'room|participant|jett|sip' | tail -30
          echo '===== livekit-server total lines in window ====='
          journalctl -u livekit-server --since '2026-10-13 18:47:00' --until '2026-10-13 18:53:30' --no-pager 2>/dev/null | wc -l
