name: tmp-sip-sniff
on:
  workflow_dispatch: {}
jobs:
  sniff:
    runs-on: [self-hosted, oracle]
    timeout-minutes: 6
    steps:
      - name: Watch port 5060 for jett INVITEs (150s)
        run: |
          date -u +'sniff window opens %H:%M:%S UTC'
          sudo timeout 150 tcpdump -ni any -A -l 'udp port 5060 or tcp port 5060' > /tmp/sipcap.txt 2>/dev/null || true
          date -u +'sniff window closed %H:%M:%S UTC'
          echo "total INVITEs seen: $(grep -ac 'INVITE sip:' /tmp/sipcap.txt)"
          echo '--- jett INVITEs + responses ---'
          grep -aE 'INVITE sip:jett|jett@129|SIP/2.0 (200|404|480|486|603)' /tmp/sipcap.txt | head -20 || echo 'NO jett traffic captured'
