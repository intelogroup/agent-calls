name: tmp-spec-logs
on:
  workflow_dispatch: {}
jobs:
  logs:
    runs-on: [self-hosted, oracle]
    timeout-minutes: 6
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Speculative-feed lines from jett-voice logs
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_DEPLOY_TOKEN }}
        run: |
          timeout 45 flyctl logs -a jett-voice --no-tail 2>&1 | tail -3000 > flylogs.txt || true
          echo "=== spec / classify / latency lines ==="
          grep -aiE 'spec_|dg_|call_classified|e2e_latency|brain usage|session started|caller hung' flylogs.txt | tail -3000 || true
