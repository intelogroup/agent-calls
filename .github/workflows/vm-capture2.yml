name: VM capture full INVITE (temporary)
on:
  workflow_dispatch:
jobs:
  capture:
    runs-on: [self-hosted, oracle]
    timeout-minutes: 5
    steps:
      - name: Capture and dump Jim's INVITE
        run: |
          echo "CAPTURE START $(date -u +%H:%M:%S) - CALL NOW"
          sudo timeout 100 tcpdump -i any -n -s 1500 -w /tmp/jim.pcap "udp port 5060 and src net 172.56.0.0/16" 2>&1 | tail -2
          echo "=== packet count ==="
          tcpdump -r /tmp/jim.pcap -n 2>/dev/null | wc -l
          echo "=== first INVITE hex/ascii ==="
          tcpdump -r /tmp/jim.pcap -n -X 2>/dev/null | head -70
