name: VM firewall fix (temporary)
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: [self-hosted, oracle]
    timeout-minutes: 10
    steps:
      - name: Open SIP 5060 and RTP 12000-12100 in iptables, persist
        run: |
          set -e
          for spec in "udp 5060" "tcp 5060" "udp 12000:12100"; do
            set -- $spec
            sudo iptables -C INPUT -p $1 --dport $2 -j ACCEPT 2>/dev/null \
              || sudo iptables -I INPUT 5 -p $1 --dport $2 -j ACCEPT
          done
          echo "--- INPUT chain after fix ---"
          sudo iptables -L INPUT -n --line-numbers
          echo "--- persist ---"
          if command -v netfilter-persistent >/dev/null 2>&1; then
            sudo netfilter-persistent save
          else
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q iptables-persistent
            sudo netfilter-persistent save
          fi
          echo "--- verify restore file ---"
          sudo grep -E "5060|12000" /etc/iptables/rules.v4 || true
