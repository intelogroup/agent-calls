name: VM debug inbound (temporary)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: [self-hosted, oracle]
    timeout-minutes: 5
    steps:
      - run: |
          echo "=== VAD/STT/transcript events in last 5 min ==="
          sudo journalctl -u jett-proxy --since "5 minutes ago" 2>&1 | grep -i -E "vad|stt|transcript|user_turn|speech|audio_frame|track|participant" | head -25
          echo ""
          echo "=== any errors? ==="
          sudo journalctl -u jett-proxy --since "5 minutes ago" 2>&1 | grep -i -E "error|exception|traceback|failed" | head -10
