name: VM network diagnostic (temporary)
on:
  workflow_dispatch:
jobs:
  netcheck:
    runs-on: [self-hosted, oracle]
    timeout-minutes: 5
    steps:
      - name: Diagnose local firewall and SIP listener
        run: |
          echo "=== ufw ==="; sudo ufw status numbered 2>&1 | head -30
          echo "=== iptables INPUT ==="; sudo iptables -L INPUT -n --line-numbers 2>&1 | head -30
          echo "=== nft ==="; sudo nft list ruleset 2>&1 | head -20
          echo "=== UDP 5060 bind ==="; sudo ss -ulnp 2>/dev/null | grep 5060 || echo "nothing on UDP 5060"
          echo "=== TCP 5060 bind ==="; sudo ss -tlnp 2>/dev/null | grep 5060 || echo "nothing on TCP 5060"
          echo "=== services ==="; systemctl is-active livekit-sip jett-proxy
          echo "=== default route / primary IP ==="; ip -4 route get 1.1.1.1 2>/dev/null
