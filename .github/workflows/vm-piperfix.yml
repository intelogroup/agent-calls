name: VM fix TTS factory (temporary)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: [self-hosted, oracle]
    timeout-minutes: 5
    steps:
      - run: |
          echo "=== finding _tts function ==="
          grep -n -B2 -A8 "^def _tts" /opt/agent/live_agent.py | head -20
          echo ""
          echo "=== also check for _tts assignment ==="
          grep -n "_tts =" /opt/agent/live_agent.py | head -5
