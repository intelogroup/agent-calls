name: VM fix Piper regex (temporary)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: [self-hosted, oracle]
    timeout-minutes: 5
    steps:
      - run: |
          sudo /opt/agent/venv/bin/python << 'PYEOF'
          import re
          with open('/opt/agent/live_agent.py', 'r') as f:
              c = f.read()
          
          # Replace the entire _PiperChunkedStream class using regex
          pattern = r'class _PiperChunkedStream\(tts\.ChunkedStream\):.*?output_emitter\.flush\(\)'
          
          new_class = '''class _PiperChunkedStream(tts.ChunkedStream):
              async def _run(self, output_emitter: tts.AudioEmitter) -> None:
                  loop = asyncio.get_running_loop()
                  output_emitter.initialize(
                      request_id=uuid.uuid4().hex[:12],
                      sample_rate=22050,
                      num_channels=1,
                      mime_type="audio/pcm",
                      stream=False,
                  )
                  for sent in split_sentences(self._input_text):
                      try:
                          samples, _sr = await loop.run_in_executor(
                              None, self._tts._synth, sent)
                      except Exception as e:
                          log_event("tts_error", sentence_len=len(sent),
                                    error=str(e)[:150])
                          continue
                      if samples is None or len(samples) == 0:
                          log_event("tts_empty_synth", sentence_len=len(sent))
                          continue
                      pcm = (np.clip(samples, -1.0, 1.0) * 32767).astype(
                          np.int16).tobytes()
                      frame_bytes = 22050 * 2 // 50
                      for i in range(0, len(pcm), frame_bytes):
                          output_emitter.push(pcm[i:i + frame_bytes])
                  output_emitter.flush()'''
          
          new_c, n = re.subn(pattern, new_class, c, flags=re.DOTALL)
          if n == 1:
              with open('/opt/agent/live_agent.py', 'w') as f:
                  f.write(new_c)
              print(f"Replaced _PiperChunkedStream ({n} match)", flush=True)
          else:
              print(f"ERROR: found {n} matches", flush=True)
              exit(1)
          PYEOF
          echo ""
          sudo /opt/agent/venv/bin/python -m py_compile /opt/agent/live_agent.py && echo "syntax OK"
          echo ""
          echo "=== switching to Piper as primary ==="
          sudo /opt/agent/venv/bin/python << 'PYEOF'
          with open('/opt/agent/live_agent.py', 'r') as f:
              c = f.read()
          c = c.replace("_TTS_ENGINE = EspeakTTS()", "_TTS_ENGINE = PiperTTS()")
          c = c.replace("return _TTS_ENGINE if _TTS_ENGINE is not None else EspeakTTS()",
                        "return _TTS_ENGINE if _TTS_ENGINE is not None else PiperTTS()")
          with open('/opt/agent/live_agent.py', 'w') as f:
              f.write(c)
          print("Switched to PiperTTS as primary", flush=True)
          PYEOF
          sudo /opt/agent/venv/bin/python -m py_compile /opt/agent/live_agent.py && echo "syntax OK"
          sudo systemctl restart jett-proxy
          sleep 8
          sudo systemctl is-active jett-proxy
          sudo journalctl -u jett-proxy --since "30 seconds ago" 2>&1 | grep -i "tts ready" | head -2
