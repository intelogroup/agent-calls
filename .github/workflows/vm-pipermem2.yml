name: VM piper in-memory v2 (temporary)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: [self-hosted, oracle]
    timeout-minutes: 10
    steps:
      - run: |
          echo "=== installing piper-tts with sudo ==="
          sudo /opt/agent/venv/bin/pip install -q piper-tts 2>&1 | tail -3
          echo ""
          echo "=== verifying ==="
          /opt/agent/venv/bin/python -c "from piper import PiperVoice; print('piper-tts OK')" 2>&1 | head -3
          echo ""
          echo "=== in-memory test ==="
          /opt/agent/venv/bin/python << 'PYEOF'
          import time, wave, io
          from piper import PiperVoice
          VOICE = "/opt/agent/models/piper/en_US-lessac-medium.onnx"
          print("Loading voice into memory...", flush=True)
          t0 = time.time()
          voice = PiperVoice.load(VOICE)
          print(f"Voice load (one-time): {time.time()-t0:.2f}s", flush=True)
          sentences = [
              "Hello Jim, this is Jett's assistant.",
              "I'm testing Piper with the voice kept in memory to eliminate reload overhead.",
              "This is the third sentence to verify seamless streaming."
          ]
          print(f"\nStreaming {len(sentences)} sentences (voice stays loaded):", flush=True)
          for i, sent in enumerate(sentences):
              t0 = time.time()
              wav_io = io.BytesIO()
              with wave.open(wav_io, "wb") as wf:
                  wf.setnchannels(1); wf.setsampwidth(2); wf.setframerate(voice.config.sample_rate)
                  voice.synthesize(sent, wf)
              gen = time.time() - t0
              wav_io.seek(0)
              with wave.open(wav_io, "rb") as w:
                  dur = w.getnframes() / w.getframerate()
              with open(f"/tmp/piper-mem-{i}.wav", "wb") as f:
                  f.write(wav_io.getvalue())
              print(f"  Sentence {i+1}: gen={gen:.2f}s, audio={dur:.2f}s, ratio={gen/dur:.2f}x", flush=True)
              if i == 0:
                  print(f"  >>> TIME-TO-FIRST-AUDIO: {gen:.2f}s <<<", flush=True)
          PYEOF
