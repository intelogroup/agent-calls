name: VM RTP capture (temporary)
on:
  workflow_dispatch:
jobs:
  cap:
    runs-on: [self-hosted, oracle]
    timeout-minutes: 4
    steps:
      - run: |
          # capture RTP (UDP 12000-12100) for 100s during Jim's call
          sudo timeout 100 tcpdump -i any -w /tmp/rtp.pcap "udp portrange 12000-12100" 2>/dev/null || true
          echo "=== capture done ==="
          sudo chown $USER:$USER /tmp/rtp.pcap 2>/dev/null || sudo chmod 644 /tmp/rtp.pcap
          # analyze: count packets by direction
          python3 -c "
          import struct
          pkts = []
          with open('/tmp/rtp.pcap','rb') as f:
            data = f.read()
          # pcap global header 24 bytes, then packets
          off = 24
          srv = '129.159.189.244'
          to_phone = 0; from_phone = 0
          while off + 16 < len(data):
            ts_sec, ts_usec, incl, orig = struct.unpack('<IIII', data[off:off+16])
            pkt = data[off+16:off+16+incl]
            off += 16 + incl
            if len(pkt) < 42: continue
            # ethernet(14) + ip(20) + udp(8) = 42; check for 'any' interface linux cooked (16)
            # try to find UDP: look for ip protocol 17
            # simplified: find src/dst IP in packet
            try:
              # assume ethernet
              iph = pkt[14:34]
              if len(iph) < 20: continue
              if iph[9] != 17: continue
              src = '.'.join(str(b) for b in iph[12:16])
              dst = '.'.join(str(b) for b in iph[16:20])
              udph = pkt[34:42]
              sport, dport = struct.unpack('!HH', udph[:4])
              if 12000 <= sport <= 12100 or 12000 <= dport <= 12100:
                if src == srv: to_phone += 1
                else: from_phone += 1
            except: pass
          print(f'server_to_phone RTP packets: {to_phone}')
          print(f'phone_to_server RTP packets: {from_phone}')
          "
