name: VM SIP logs (temporary)
on:
  workflow_dispatch:
jobs:
  logs:
    runs-on: [self-hosted, oracle]
    timeout-minutes: 5
    steps:
      - name: Check dispatch and agent pickup
        run: |
          echo "=== livekit-sip around test INVITE (18:57:25-18:58:10) ==="
          sudo journalctl -u livekit-sip --since "18:57:25" --until "18:58:10" -o cat 2>&1 | grep -aviE "options" | tail -30
          echo "=== jett-proxy job activity (18:57:25-18:58:30) ==="
          sudo journalctl -u jett-proxy --since "18:57:25" --until "18:58:30" -o cat 2>&1 | grep -aiE "job|dispatch|invite|room|participant|error" | tail -25
