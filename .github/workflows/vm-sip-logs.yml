name: VM SIP logs (temporary)
on:
  workflow_dispatch:
jobs:
  logs:
    runs-on: [self-hosted, oracle]
    timeout-minutes: 5
    steps:
      - name: Diagnose UDP delivery to livekit-sip
        run: |
          echo "=== who owns UDP 5060 ==="
          sudo ss -ulnp 2>/dev/null | grep 5060 || ss -ulnp 2>/dev/null | grep 5060
          echo "=== UDP snmp counters ==="
          cat /proc/net/snmp | grep -A1 "^Udp:"
          echo "=== conntrack count/max ==="
          cat /proc/sys/net/netfilter/nf_conntrack_count 2>/dev/null; cat /proc/sys/net/netfilter/nf_conntrack_max 2>/dev/null
          echo "=== rp_filter ==="
          sysctl -n net.ipv4.conf.ens3.rp_filter 2>/dev/null; sysctl -n net.ipv4.conf.all.rp_filter 2>/dev/null
          echo "=== dmesg drops ==="
          dmesg 2>/dev/null | grep -aiE "conntrack|table full|drop|rpfilter|martian" | tail -5 || sudo dmesg | grep -aiE "conntrack|table full|martian" | tail -5
          echo "=== localhost INVITE test ==="
          python3 - <<'PYEOF'
          import socket, time
          s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
          s.settimeout(3)
          inv = b"INVITE sip:jett@127.0.0.1 SIP/2.0\r\nVia: SIP/2.0/UDP 127.0.0.1:5099;branch=z9hG4bKlo1;rport\r\nFrom: <sip:lo@127.0.0.1>;tag=lo1\r\nTo: <sip:jett@127.0.0.1>\r\nCall-ID: lotest1@127.0.0.1\r\nCSeq: 1 INVITE\r\nContact: <sip:lo@127.0.0.1:5099>\r\nMax-Forwards: 70\r\nContent-Length: 0\r\n\r\n"
          s.sendto(inv, ("127.0.0.1", 5060))
          try:
              while True:
                  data, _ = s.recvfrom(4096)
                  print("LOCAL RECV:", data[:60])
                  if b"180" in data or b"200" in data or b"486" in data or b"404" in data or b"403" in data: break
          except socket.timeout:
              print("LOCAL: no response")
          PYEOF
