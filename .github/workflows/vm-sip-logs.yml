name: VM SIP logs (temporary)
on:
  workflow_dispatch:
jobs:
  logs:
    runs-on: [self-hosted, oracle]
    timeout-minutes: 5
    steps:
      - name: Tail SIP bridge and proxy logs
        run: |
          echo "=== livekit-sip (last 15 min) ==="
          sudo journalctl -u livekit-sip --since "15 minutes ago" -o cat 2>&1 | tail -60
          echo "=== jett-proxy (last 15 min) ==="
          sudo journalctl -u jett-proxy --since "15 minutes ago" -o cat 2>&1 | tail -40
