# PROPOSED production config for the durable voice-worker image.
# Derived from ~/workspace/jett-voice-image/fly.toml (dry-test) and
# ~/workspace/fly-voice/fly.toml (Sep 28 prod). NOT yet applied.
app = "jett-voice"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  AGENT_DIR = "/opt/agent"
  SPECULATIVE_FEED = "1"
  DEEPGRAM_BRIDGE = "1"
  # Ring-me-first (Jim, 2026-10-15): inbound PSTN calls ring Jim's
  # cell for 10s before the agent answers. Unset = agent answers
  # immediately, as before.
  RING_FIRST = "1"
  # Parakeet Redux streaming STT replaces Whisper in the local
  # pipeline (Jim's decision, 2026-10-15). Unset = Whisper fallback.
  STREAMING_STT = "1"
  # No DRY_TEST here: production mode. Worker uses LIVEKIT_URL and
  # TUNNEL_SSH_KEY from Fly secrets on the jett-voice app.

[[vm]]
  size = "shared-cpu-4x"
  memory = "8gb"

auto_stop_machines = false
auto_start_machines = true

