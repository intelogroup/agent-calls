# PROPOSED production config for the durable voice-worker image.
# Derived from ~/workspace/jett-voice-image/fly.toml (dry-test) and
# ~/workspace/fly-voice/fly.toml (Sep 28 prod). NOT yet applied.
app = "jett-voice"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  AGENT_DIR = "/opt/agent"
  SPECULATIVE_FEED = "1"
  # No DRY_TEST here: production mode. Worker uses LIVEKIT_URL and
  # TUNNEL_SSH_KEY from Fly secrets on the jett-voice app.

[[vm]]
  size = "shared-cpu-4x"
  memory = "8gb"

auto_stop_machines = false
auto_start_machines = true

[deploy]
  release_command = "HF_HUB_OFFLINE=1 timeout 200 python3 /opt/agent/bench_fly.py || true"
